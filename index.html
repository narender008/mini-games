<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mini Games</title>
    <meta name="description" content="A small collection of free browser games. Pick one and play: no install, no sign-up." />
    <meta name="theme-color" content="#11163f" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <header class="hero">
      <p class="eyebrow">Free browser games</p>
      <h1>Mini Games</h1>
      <p class="tagline">Pick a game and play. Nothing to install, nothing to sign up for.</p>
    </header>
    <main>
      <h2 class="sr">Games</h2>
      <ul id="games" class="grid"></ul>
      <noscript><p class="note">The game list needs JavaScript. You can still open <a href="games/balloon-pop/">Balloon Pop</a> directly.</p></noscript>
    </main>
    <footer>
      <p>Made to play in any modern browser, on a laptop or a phone.</p>
    </footer>
    <script src="games.js"></script>
    <script src="assets/site.js"></script>
  </body>
</html>
