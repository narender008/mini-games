name: Skyforge tests

on:
  pull_request:
    paths:
      - 'games/skyforge/**'
      - '.github/workflows/skyforge-tests.yml'
  push:
    branches: [main]
    paths:
      - 'games/skyforge/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: games/skyforge/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skyforge-test-reports
          path: games/skyforge/test/out/
          if-no-files-found: ignore
