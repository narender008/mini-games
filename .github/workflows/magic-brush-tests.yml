name: Magic Brush tests

on:
  pull_request:
    paths:
      - 'games/magic-brush/**'
      - '.github/workflows/magic-brush-tests.yml'
  push:
    branches: [main]
    paths:
      - 'games/magic-brush/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # (every frame is rendered in software: about 8 minutes on a 4-core machine, allow for slower runners)
    timeout-minutes: 60
    defaults:
      run:
        working-directory: games/magic-brush/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-brush-test-reports
          path: games/magic-brush/test/out/
          if-no-files-found: ignore
