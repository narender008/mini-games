<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loomwake bosses (dev)</title>
<style>
  html, body { margin: 0; background: #05060f; color: #f2c46b; font: 13px 'Segoe UI', system-ui, sans-serif; }
  #bar { position: fixed; left: 0; top: 0; right: 0; padding: 6px 10px; background: rgba(5,6,15,0.85); z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #bar a { color: #ffe9b0; text-decoration: none; padding: 2px 8px; border: 1px solid #5a4a2a; border-radius: 4px; }
  #bar a.on { background: #3a2c10; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="bar"></div>
<canvas id="c"></canvas>
<script type="module">
// Dev sheet for the bosses: every boss in every phase and attack pose, plus the
// arena set pieces. ?boss=veyl|morrow|aurum|sable  ?view=sheet|zones|live  ?dark=1 ?cols=N ?scale=S ?freeze=T
// Live mode runs the real sim (engine world + bosses) with a scripted hero.
import { PAINTERS, drawZone, drawProjectile, drawOverlay } from '../src/render/actors/bosses/index.js';
import { BOSSES } from '../src/content/bosses.js';
import { glow, shadow } from '../src/render/actors/bosses/kit.js';

const Q = new URLSearchParams(location.search);
const id = Q.get('boss') || 'veyl';
const view = Q.get('view') || 'sheet';
const dark = Q.get('dark') === '1';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DPR = Math.min(2, devicePixelRatio || 1);
const bar = document.getElementById('bar');
for (const b of ['veyl', 'morrow', 'aurum', 'sable']) for (const v of ['sheet', 'zones', 'live']) {
  const a = document.createElement('a'); a.href = `?boss=${b}&view=${v}`; a.textContent = `${b} ${v}`; if (b === id && v === view) a.className = 'on'; bar.appendChild(a);
}
const FLOOR = { veyl: ['#16243a', '#0a1020', '#7ff0e0'], morrow: ['#0e1a36', '#060a1a', '#8fd6ff'], aurum: ['#2a160e', '#0e0806', '#ffb54a'], sable: ['#16101f', '#07050c', '#c86bff'] };

const MOVES = {
  veyl: { 1: ['lanes', 'volley', 'claw', 'burrow'], 2: ['lanes2', 'ring', 'verdict', 'summon', 'claw'] },
  morrow: { 1: ['ring', 'sweep', 'notes', 'summon', 'sink'], 2: ['choir', 'flood', 'sweep'], 3: ['requiem', 'ring'] },
  aurum: { 1: ['slam', 'sweep', 'anvil', 'breath'], 2: ['chain', 'heat', 'slam'], 3: ['pour', 'sweep'] },
  sable: { 1: ['lunge', 'combo', 'snare', 'riposte', 'echoes'], 2: ['dash', 'combo', 'mirror', 'storm', 'lunge'] },
};
function cells(id) {
  const def = BOSSES[id], n = def.phases.length + 1;
  const out = [];
  out.push({ label: 'intro 0.6s', state: 'intro', st: 0.6, phase: 1 });
  out.push({ label: 'intro 2.2s', state: 'intro', st: 2.2, phase: 1 });
  for (let p = 1; p <= n; p++) {
    out.push({ label: `phase ${p} idle`, state: 'idle', phase: p });
    for (const m of MOVES[id][p] || []) {
      out.push({ label: `p${p} ${m} wind`, state: m, act: m, pose: 'wind', pt: 0.85, phase: p });
      out.push({ label: `p${p} ${m} strike`, state: m, act: m, pose: 'act', pt: 0.4, phase: p });
    }
    if (p < n) out.push({ label: `phase change to ${p + 1}`, state: 'phase', st: 1.3, phase: p + 1 });
  }
  out.push({ label: 'stagger', state: 'stagger', st: 0.5, phase: 1 });
  out.push({ label: 'hit flash', state: 'idle', flash: 0.1, phase: 1 });
  out.push({ label: 'dying 0.7s', state: 'dying', st: 0.7, phase: n });
  out.push({ label: 'dying 1.6s', state: 'dying', st: 1.6, phase: n });
  out.push({ label: 'dying 2.4s', state: 'dying', st: 2.4, phase: n });
  if (id === 'sable') { out.push({ label: 'true ending: choice', state: 'choice', st: 1, phase: 2 }); out.push({ label: 'braided 1.5s', state: 'braided', st: 1.5, phase: 2 }); }
  return out;
}

function makeE(id, c, i) {
  const def = BOSSES[id];
  return {
    id: 100 + i, kind: id, boss: true, x: 0, y: 0, z: 0, vx: 0, vy: 0, r: def.r, hp: 1, maxHp: 1, armor: 1, maxArmor: 1,
    facing: Math.PI / 2 + (c.act ? -0.5 : 0), aim: Math.PI / 2 - 0.4, state: c.state, st: c.st || 0, phase: c.phase, phases: def.phases.length + 1,
    act: c.act ? { name: c.act, t: 0, once: {} } : null, pose: c.pose || 'idle', pt: c.pt || 0, flash: c.flash || 0,
    sunk: c.act === 'burrow' || c.act === 'sink' ? (c.pose === 'wind' ? 0.6 : 1) : 0, heat: c.phase > 1 ? (c.phase === 2 ? 0.75 : 1) : 0,
    masked: !(id === 'sable' && c.phase > 1), mirror: c.act === 'mirror' ? 'storm' : null, comboI: c.pose === 'act' ? 1 : 0, ghost: c.pose === 'act' && (c.act === 'lunge' || c.act === 'dash') ? 1 : 0,
    anim: {}, lights: [], dying: c.state === 'dying', trueEnding: c.state === 'choice' || c.state === 'braided', singing: c.act === 'choir' ? [0, 1] : null,
  };
}

const P = {
  glow: (c, x, y, r, col, a) => glow(c, x, y, r, col, a), shadow: (c, rx, ry, a) => shadow(c, rx, ry, a), q: 'high', t: 0,
};

let W = 0, H = 0;
function resize() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
addEventListener('resize', resize); resize();

function drawIri(c, x, y) {
  // scale reference: Iri, ~80 px tall
  c.save(); c.translate(x, y);
  shadow(c, 22, 8, 0.5);
  c.fillStyle = '#7a1a34'; c.beginPath(); c.moveTo(-13, -50); c.quadraticCurveTo(-22, -20, -20, -4); c.lineTo(20, -4); c.quadraticCurveTo(22, -20, 13, -50); c.fill();
  c.fillStyle = '#9b2244'; c.beginPath(); c.arc(0, -62, 12.5, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#f3cfae'; c.beginPath(); c.ellipse(0, -60, 7, 7.5, 0, 0, 7); c.fill();
  c.strokeStyle = '#f2c46b'; c.lineWidth = 4; c.beginPath(); c.moveTo(8, -40); c.quadraticCurveTo(30, -50, 44, -30); c.stroke();
  c.restore();
}

// ---------- sheet ----------
const only = Q.get('only') ? Q.get('only').split(',').map(Number) : null;
const list = cells(id).map((c, i) => ({ c, e: makeE(id, c, i) })).filter((x, i) => !only || only.includes(i));
const cellW = 330, cellH = id === 'sable' ? 220 : id === 'aurum' ? 470 : 420;
function sheet(t) {
  const cols = +(Q.get('cols') || Math.max(1, Math.floor((W - 20) / (cellW * (+Q.get('scale') || 0.62)))));
  const s = +(Q.get('scale') || 0.62);
  const rows = Math.ceil(list.length / cols);
  const totalH = 40 + rows * cellH * s + 20;
  if (Math.abs(cv.height - totalH * DPR) > 2) { cv.height = totalH * DPR; cv.style.height = totalH + 'px'; H = totalH; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [f0, f1] = FLOOR[id];
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, f0); gr.addColorStop(1, f1);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  const G = { t, hitstop: 0, boss: null, zones: [], chamber: null };
  list.forEach(({ c, e }, i) => {
    const cx = (i % cols) * cellW * s + 10, cy = 40 + Math.floor(i / cols) * cellH * s;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(s, s);
    ctx.strokeStyle = 'rgba(242,196,107,0.15)'; ctx.strokeRect(2, 2, cellW - 4, cellH - 4);
    // floor disc
    const fg = ctx.createRadialGradient(cellW / 2, cellH - 50, 10, cellW / 2, cellH - 50, cellW * 0.6);
    fg.addColorStop(0, 'rgba(255,255,255,0.06)'); fg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = fg; ctx.fillRect(0, 0, cellW, cellH);
    drawIri(ctx, 38, cellH - 40);
    ctx.translate(cellW / 2 + 20, cellH - 40);
    if (!Q.has('freeze')) { if (c.st != null && e.state !== 'idle') { /* fixed */ } }
    e.lights = [];
    G.boss = e;
    try { PAINTERS[id](ctx, e, G, P); } catch (err) { console.error(err); ctx.fillStyle = 'red'; ctx.fillText(String(err), -100, -100); }
    ctx.restore();
    ctx.fillStyle = '#f2c46b'; ctx.font = '600 12px Segoe UI, sans-serif'; ctx.fillText(c.label, cx + 6, cy + 16);
  });
}

// ---------- zones ----------
function zonesView(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [f0, f1] = FLOOR[id];
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, f0); gr.addColorStop(1, f1); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  const s = Math.min(W / 2000, H / 1300);
  ctx.setTransform(DPR * s, 0, 0, DPR * s, W * DPR / 2, H * DPR / 2);
  const G = ZG(t);
  for (const z of G.zones) drawZone(ctx, z, G, P);
  for (const p of G.projectiles) drawProjectile(ctx, p, G, P);
  const e = G.boss;
  ctx.save(); ctx.translate(e.x, e.y); PAINTERS[id](ctx, e, G, P); ctx.restore();
  drawOverlay(ctx, G, P);
}
const zg = { e: null };
function ZG(t) {
  // a frozen tableau of each boss's set pieces at mid-flight
  const e = zg.e || (zg.e = makeE(id, { state: 'idle', phase: 2 }, 999));
  e.x = 0; e.y = -120;
  const zones = [], projectiles = [];
  const Z = (k, o) => zones.push(Object.assign({ kind: 'boss:' + k, team: 'boss', owner: e.id, boss: id, age: 1, life: 1, t: 999 }, o));
  const loop = (p) => (t % p) / p;
  if (id === 'veyl') {
    for (const off of [-0.36, 0, 0.36]) Z('spikeLine', { x: 0, y: -60, ang: Math.PI / 2 + 0.6 + off, len: 900, w: 64, speed: 1500, front: 900 * Math.min(1, loop(2) * 1.6), hold: 0.5, theme: 'thorn', seed: (off * 100) | 0 });
    Z('impact', { x: -500, y: 200, r: 72, fall: 0.85, age: loop(1.4) * 1.3, item: 'glass', seed: 3, get landed() { return this.age > this.fall; }, get life() { return 0.7 - (this.age - this.fall); } });
    for (let i = -3; i <= 3; i++) for (let j = 0; j < 2; j++) if ((i + j) % 2 === 0) Z('patch', { x: i * 210 + 50, y: 300 + j * 210, hw: 99, warn: 1, up: 0.55, age: 0.6 + loop(2) * 1.2, seed: i * 3 + j });
    Z('edge', { s: 0.86, target: 0.8, rate: 0.05 });
    for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2 + t; projectiles.push({ kind: 'boss:thorn', boss: id, x: Math.cos(a) * 260, y: -120 + Math.sin(a) * 200, z: 50, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, r: 11 }); }
  }
  if (id === 'morrow') {
    Z('wave', { x: 0, y: -120, r: 200 + loop(3) * 700, speed: 330, w: 34, maxR: 1250, gaps: [], theme: 'water' });
    Z('wave', { x: -700, y: -300, r: 100 + loop(2.4) * 500, speed: 330, w: 30, maxR: 1250, gaps: [{ a: 0.5, arc: 0.62 }, { a: 2.6, arc: 0.62 }, { a: 4.7, arc: 0.62 }], theme: 'water' });
    Z('flood', { x0: -1000, y0: 0, x1: 0, y1: 650, warn: 1.1, age: 0.5 + loop(4) * 3, life: 2, tick: 0.35 });
    Z('beam', { x: 0, y: -120, ang: 0.3 + Math.sin(t) * 0.6, len: 720, w: 54, on: true });
    for (let i = 0; i < 5; i++) projectiles.push({ kind: 'boss:note', boss: id, x: 300 + i * 70, y: -300 + i * 30, z: 90, vx: 200, vy: 30, r: 13, seed: i });
    e.choir = [[-850, -250], [850, -250], [-500, 450], [500, 450]].map(([x, y], i) => ({ x, y, i })); e.singing = [1];
  }
  if (id === 'aurum') {
    e.heat = 0.8;
    Z('heat', { x: 0, y: 0, warn: 1.4, age: 0.4 + loop(4) * 3, life: 2, safe: [{ x: -500, y: 200, r: 175 }, { x: 400, y: 300, r: 175 }, { x: 600, y: -300, r: 175 }] });
    Z('wave', { x: 200, y: 0, r: 150 + loop(1.5) * 450, speed: 520, w: 30, maxR: 640, gaps: [], theme: 'molten' });
    Z('pool', { x: -300, y: 300, r: 110, age: 2, life: 4, theme: 'aurum', seed: 4 });
    for (let i = 0; i < 8; i++) Z('spikeLine', { x: 0, y: -120, ang: i / 8 * Math.PI * 2, len: 1100, w: 58, speed: 1150, front: 1100 * Math.min(1, loop(2.5) * 1.4), hold: 0.45, theme: 'molten', seed: i });
    Z('impact', { x: -600, y: -200, r: 120, fall: 1.2, age: loop(1.6) * 1.5, item: 'anvil', sx: 0, sy: -120, get landed() { return this.age > this.fall; }, get life() { return 0.7 - (this.age - this.fall); } });
    for (let i = 0; i < 20; i++) projectiles.push({ kind: 'boss:spark', boss: id, x: 100 + i * 25, y: -100 + Math.sin(i) * 40, z: 120 - i * 3, vx: 520, vy: 40, r: 10 });
  }
  if (id === 'sable') {
    e.masked = false; e.phase = 2;
    for (let i = 0; i < 6; i++) { const a = i * 0.5 + 0.2; Z('slash', { x: Math.cos(a) * -1200, y: Math.sin(a) * -700 + 100, x2: Math.cos(a) * 1200, y2: Math.sin(a) * 700 + 100, w: 34, warn: 0.75, age: (loop(1.8) * 1.4 + i * 0.12) % 1.4, life: 1 }); }
    Z('edge', { s: 0.86, target: 0.84, theme: 'void' });
    Z('burst', { x: -500, y: 250, r: 140, warn: 0.8, age: loop(1.6) * 1.3, done: loop(1.6) * 1.3 > 0.8, get life() { return 1.3 - this.age; }, theme: 'dawn' });
    Z('burst', { x: 500, y: 250, r: 90, warn: 0.7, age: loop(1.4) * 1.2, done: loop(1.4) * 1.2 > 0.7, get life() { return 1.2 - this.age; }, theme: 'storm' });
    Z('tether', { x: 0, y: -120, hx: 300, hy: 120, bound: true });
    Z('spikeLine', { x: 0, y: -100, ang: 2.2, len: 900, w: 54, speed: 1400, front: 900 * Math.min(1, loop(2) * 1.5), hold: 0.35, theme: 'void' });
    for (let i = 0; i < 3; i++) projectiles.push({ kind: 'boss:gust', boss: id, x: 200 + i * 40, y: -300 + i * 90, z: 40, vx: 640, vy: 100, r: 24, ang: 0.15 });
  }
  return { t, boss: e, zones, projectiles, telegraphs: [], chamber: { _bossArena: { cx: 0, cy: 0, rx: 950, ry: 600 } }, hero: { x: 300, y: 120 } };
}

// ---------- live ----------
let live = null;
async function startLive() {
  const ROOT = '../src/';
  const { createGame } = await import(ROOT + 'state.js');
  const Wd = await import(ROOT + 'sim/world.js');
  const C = await import(ROOT + 'sim/combat.js');
  const E = await import(ROOT + 'sim/enemies/index.js');
  const B = await import(ROOT + 'sim/bosses/index.js');
  const Hm = await import(ROOT + 'sim/hero.js');
  let EA = null; try { EA = await import(ROOT + 'render/actors/enemies/index.js'); } catch (err) { /* optional */ }
  const G = createGame({ seed: +(Q.get('seed') || 3) });
  G.chamber = Wd.testChamber(5); G.scene = 'run'; G.meta = { stats: {} }; G.run = { boons: [{ id: 'a', patron: 'storm' }, { id: 'b', patron: 'dawn' }] };
  Wd.setSystems({ updateFoes: E.updateFoes, updateBosses: B.updateBosses });
  Hm.resetHero?.(G, { x: 0, y: 300, full: true });
  G.hero.maxHp = G.hero.hp = 400; G.hero.stats.dmg = 2;
  if (Q.has('god')) G.god = true;
  const e = B.startBoss(G, id, { trueEnding: Q.has('true') });
  if (Q.get('phase')) { for (let i = 1; i < +Q.get('phase'); i++) B.killBoss(G); }
  live = { G, Wd, C, E, B, EA, acc: 0 };
  window.__bosses = live;
}
function liveFrame(t, dt) {
  if (!live) return;
  const { G, Wd, C, EA } = live;
  live.acc += Math.min(dt, 0.05);
  while (live.acc >= 1 / 120) { live.acc -= 1 / 120; bot(G, C, Wd); Wd.stepWorld(G, 1 / 120); G.t += 1 / 120; if (G.boss && G.boss.state === 'choice') live.B.resolveBossChoice(G, 'braid'); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [f0, f1] = FLOOR[id];
  ctx.fillStyle = f1; ctx.fillRect(0, 0, W, H);
  const s = Math.min(W / 2200, H / 1400) * 1.0;
  ctx.setTransform(DPR * s, 0, 0, DPR * s, W * DPR / 2, H * DPR / 2);
  ctx.fillStyle = f0; ctx.beginPath(); ctx.moveTo(G.chamber.shape[0][0], G.chamber.shape[0][1]); for (const [x, y] of G.chamber.shape) ctx.lineTo(x, y); ctx.fill();
  for (const z of G.zones) drawZone(ctx, z, G, P);
  // telegraphs (simple, the engine renderer has its own)
  for (const tg of G.telegraphs) {
    const k = 1 - Math.max(0, tg.t) / (tg.max || 1);
    ctx.strokeStyle = `rgba(255,120,140,${0.4 + k * 0.6})`; ctx.fillStyle = `rgba(255,61,94,${0.08 + k * 0.2})`; ctx.lineWidth = 2;
    ctx.beginPath();
    if (tg.kind === 'circle') ctx.arc(tg.x, tg.y, tg.r, 0, 7);
    else if (tg.kind === 'line') { const a = Math.atan2(tg.y2 - tg.y, tg.x2 - tg.x), L = Math.hypot(tg.x2 - tg.x, tg.y2 - tg.y); ctx.save(); ctx.translate(tg.x, tg.y); ctx.rotate(a); ctx.rect(0, -tg.w / 2, L, tg.w); ctx.restore(); }
    else if (tg.kind === 'cone') { ctx.moveTo(tg.x, tg.y); ctx.arc(tg.x, tg.y, tg.r, tg.angle - tg.arc / 2, tg.angle + tg.arc / 2); ctx.closePath(); }
    ctx.fill(); ctx.stroke();
  }
  const items = [];
  for (const f of G.foes) items.push({ y: f.y, f });
  items.push({ y: G.hero.y, hero: true });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.hero) { if (!G.hero.dead) drawIri(ctx, G.hero.x, G.hero.y); continue; }
    const f = it.f;
    ctx.save(); ctx.translate(f.x, f.y - (f.z || 0));
    if (f.boss) PAINTERS[f.kind](ctx, f, G, P);
    else if (EA) { try { EA.drawFoe(ctx, f, G, P); } catch (err) { ctx.fillStyle = '#556'; ctx.fillRect(-15, -60, 30, 60); } }
    ctx.restore();
  }
  for (const p of G.projectiles) { if (typeof p.kind === 'string' && p.kind.startsWith('boss:')) drawProjectile(ctx, p, G, P); else { ctx.fillStyle = '#f8a'; ctx.beginPath(); ctx.arc(p.x, p.y - (p.z || 20), p.r, 0, 7); ctx.fill(); } }
  drawOverlay(ctx, G, P);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const b = G.boss;
  ctx.fillStyle = '#f2c46b'; ctx.font = '600 14px Segoe UI'; ctx.fillText(b ? `${b.name} ${Math.round(b.hp)}/${b.maxHp} arm ${Math.round(b.armor)} ph ${b.phase} ${b.state}/${b.pose} ${b.bark ? '“' + b.bark.text + '”' : ''}` : 'boss defeated', 14, H - 40);
  ctx.fillText(`hero ${Math.round(G.hero.hp)} t ${G.t.toFixed(1)}`, 14, H - 20);
}
function bot(G, C, Wd) {
  const h = G.hero, I = G.input, b = G.boss;
  I.attackP = I.dashP = I.attack = I.dash = false;
  if (!b || h.dead) { I.move = { x: 0, y: 0 }; return; }
  const dx = b.x - h.x, dy = b.y - h.y, d = Math.hypot(dx, dy) || 1;
  I.aim = { x: b.x, y: b.y }; I.aimDir = { x: dx / d, y: dy / d };
  const want = b.r + 60;
  let mx = d > want ? dx / d : d < want - 30 ? -dx / d : 0, my = d > want ? dy / d : d < want - 30 ? -dy / d : 0;
  let danger = false;
  for (const tg of G.telegraphs) if (tg.t > 0 && tg.t < 0.45 && C.inShape(tg, h.x, h.y, 24)) danger = true;
  if (danger) { mx = -dx / d; my = -dy / d; if (Math.random() < 0.1) { I.dash = I.dashP = true; } }
  else if (d < want + 40 && !b.untargetable) I.attack = I.attackP = true;
  I.move = { x: mx, y: my };
}

let last = performance.now(), T0 = performance.now();
if (view === 'live') startLive();
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  const t = Q.has('freeze') ? +Q.get('freeze') : (now - T0) / 1000;
  P.t = t;
  if (view === 'sheet') sheet(t);
  else if (view === 'zones') zonesView(t);
  else liveFrame(t, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__devStep = (n) => { for (let i = 0; i < n; i++) frame(performance.now()); };
</script>
</body>
</html>
