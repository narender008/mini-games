<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Horde Buster · Mini Games</title>
    <meta name="description" content="A grown-up horde shooter: hold the bottom of the road, steer with the mouse and blast waves of zombies, demons and spiders into gory chaos. Ages 18+." />
    <meta name="theme-color" content="#0d1226" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- "Add to Home Screen" opens the game full screen, with no browser bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horde Buster" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-state="loading">
    <canvas id="scene" aria-label="Horde Buster battlefield"></canvas>
    <div id="ui"></div>

    <div id="loader" role="progressbar" aria-label="Loading Horde Buster" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <p class="loader-title">Horde Buster</p>
      <div class="bar"><span id="loader-fill"></span></div>
      <p id="loader-text">Loading…</p>
    </div>

    <noscript><p class="noscript">Horde Buster needs JavaScript.</p></noscript>
    <script type="module" src="src/boot.js"></script>
  </body>
</html>
