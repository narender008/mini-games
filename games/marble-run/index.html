<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Marble Run · Mini Games</title>
    <meta name="description" content="Drop glass marbles down photoreal toy marble runs and watch them roll, spin round funnels, loop the loop and ring the bells. Build your own runs and solve puzzles. No losing, ever. For little ones and big kids." />
    <meta name="theme-color" content="#2b2622" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- "Add to Home Screen" opens the game full screen, with no browser bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marble Run" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/build/three.module.js",
          "three/addons/": "../../vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-mode="little" data-level="sunny">
    <canvas id="scene" aria-label="Marble Run: glass marbles rolling down a toy marble run"></canvas>

    <div id="loader" role="progressbar" aria-label="Loading Marble Run" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="loader-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-logo" /></svg>
      <p class="loader-title">Marble Run</p>
      <div class="bar"><span id="loader-fill"></span></div>
      <p id="loader-text">Loading…</p>
    </div>

    <!-- start screen -->
    <section id="menu" hidden aria-labelledby="title">
      <a class="chip home-link" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span>Games</span>
      </a>
      <div class="menu-main">
        <h1 id="title" class="logo"><span class="sr">Marble Run</span><span aria-hidden="true">Marble&nbsp;Run</span></h1>
        <div class="modes" role="radiogroup" aria-label="Who is playing">
          <button type="button" class="mode" data-mode="little" role="radio" aria-checked="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-marble" /></svg><span>Little ones</span>
          </button>
          <button type="button" class="mode" data-mode="big" role="radio" aria-checked="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-build" /></svg><span>Big kid</span>
          </button>
        </div>
        <div class="levels" data-where="menu" role="list" aria-label="Pick a marble run"></div>
      </div>
    </section>
    <button type="button" class="round fs menu-fs" aria-pressed="false" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
    </button>
    <button type="button" class="round mute menu-mute" aria-pressed="false" aria-label="Sound off" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
    </button>

    <!-- in-game HUD -->
    <div id="hud" hidden>
      <div class="hud-buttons">
        <button type="button" class="round" id="to-menu" aria-label="Back to the start screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20h-5.5v-5h-5v5H4z" class="fillc" /></svg>
        </button>
        <button type="button" class="round" id="settings-btn" aria-label="Change the marble run" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear" /></svg>
        </button>
        <button type="button" class="round mute" aria-pressed="false" aria-label="Sound off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
        </button>
        <button type="button" class="round fs" aria-pressed="false" aria-label="Full screen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
        </button>
      </div>
      <div class="hud-right">
        <button type="button" class="round" id="follow-btn" aria-pressed="false" aria-label="Ride along with a marble">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-follow" /></svg>
        </button>
      </div>
      <!-- Little ones: one big button that drops a marble in -->
      <button type="button" id="drop-btn" class="little-only" aria-label="Drop a marble in">
        <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-big-marble" /></svg>
      </button>
      <!-- Big kid: filled in by build.js -->
      <div id="build-ui" class="big-only"></div>
    </div>

    <div id="callout" aria-live="polite"></div>

    <!-- settings overlay: the run keeps going behind it -->
    <aside id="settings" hidden aria-label="Change the marble run">
      <p class="pop-title">Marble runs</p>
      <div class="levels" data-where="settings" role="list" aria-label="Pick a marble run"></div>
      <div class="modes" role="radiogroup" aria-label="Who is playing">
        <button type="button" class="mode" data-mode="little" role="radio" aria-checked="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-marble" /></svg><span>Little ones</span>
        </button>
        <button type="button" class="mode" data-mode="big" role="radio" aria-checked="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-build" /></svg><span>Big kid</span>
        </button>
      </div>
      <button type="button" class="round close" id="settings-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </aside>

    <noscript><p class="noscript">Marble Run needs JavaScript to run.</p></noscript>

    <!-- icons -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <radialGradient id="g-glass" cx="0.36" cy="0.32" r="0.8"><stop offset="0" stop-color="#bfe3ff" /><stop offset="0.45" stop-color="#3a86f0" /><stop offset="1" stop-color="#153f9a" /></radialGradient>
        <radialGradient id="g-glass-red" cx="0.36" cy="0.32" r="0.8"><stop offset="0" stop-color="#ffd0c8" /><stop offset="0.45" stop-color="#ef4a3a" /><stop offset="1" stop-color="#8e1f18" /></radialGradient>
        <radialGradient id="g-glass-gold" cx="0.36" cy="0.32" r="0.8"><stop offset="0" stop-color="#fff2c0" /><stop offset="0.45" stop-color="#ffbf2a" /><stop offset="1" stop-color="#a86a08" /></radialGradient>
        <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0cf9e" /><stop offset="1" stop-color="#cf9a5e" /></linearGradient>
        <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.3 2.5h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.5.5v3.4l-2.5.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9-2.6-.5v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8z" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="3.2" fill="#fff8ec" stroke="none" /></symbol>
        <symbol id="i-marble" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="url(#g-glass)" stroke="none" /><path d="M8 12c2-3 6-3 8 0" fill="none" stroke="#ffd23a" stroke-width="1.6" stroke-linecap="round" /><ellipse cx="9.2" cy="8.4" rx="2.4" ry="1.4" fill="#fff" opacity="0.75" stroke="none" transform="rotate(-30 9.2 8.4)" /></symbol>
        <symbol id="i-build" viewBox="0 0 24 24"><path d="M3 19h18" stroke="#8f5d3c" stroke-width="2" /><path d="M4 16l7-4h9" fill="none" stroke="url(#g-wood)" stroke-width="3.2" stroke-linecap="round" /><path d="M4 16l7-4h9" fill="none" stroke="#a4652f" stroke-width="1" stroke-linecap="round" /><rect x="15" y="12.8" width="4" height="6" rx="0.8" fill="#e2483d" stroke="none" /><circle cx="7" cy="10" r="2.6" fill="url(#g-glass-red)" stroke="none" /></symbol>
        <symbol id="i-follow" viewBox="0 0 24 24"><circle cx="12" cy="13" r="5" fill="url(#g-glass-gold)" stroke="none" /><path d="M3 8.5C5 5 8.5 3.5 12 3.5S19 5 21 8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /><path d="M5 19.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" /></symbol>
        <symbol id="i-big-marble" viewBox="0 0 64 64"><ellipse cx="32" cy="57" rx="17" ry="3.5" fill="#000" opacity="0.2" /><circle cx="32" cy="30" r="22" fill="url(#g-glass)" /><path d="M18 33c6-9 22-9 28 0M20 26c6 6 18 6 24 0" fill="none" stroke="#ffd23a" stroke-width="3.2" stroke-linecap="round" opacity="0.9" /><ellipse cx="23" cy="20" rx="6.5" ry="3.8" fill="#fff" opacity="0.8" transform="rotate(-30 23 20)" /><circle cx="42" cy="40" r="2.2" fill="#fff" opacity="0.5" /></symbol>
        <symbol id="i-logo" viewBox="0 0 64 64"><path d="M6 40l24-12h24" fill="none" stroke="url(#g-wood)" stroke-width="7" stroke-linecap="round" /><path d="M6 40l24-12h24" fill="none" stroke="#a4652f" stroke-width="1.4" stroke-linecap="round" /><rect x="46" y="31" width="10" height="24" rx="2" fill="#2f6bd0" /><rect x="10" y="42" width="10" height="13" rx="2" fill="#e2483d" /><circle cx="18" cy="24" r="8" fill="url(#g-glass-red)" /><ellipse cx="15.5" cy="20.5" rx="3" ry="1.8" fill="#fff" opacity="0.8" transform="rotate(-30 15.5 20.5)" /><circle cx="38" cy="18" r="7" fill="url(#g-glass)" /><ellipse cx="36" cy="15" rx="2.6" ry="1.5" fill="#fff" opacity="0.8" transform="rotate(-30 36 15)" /></symbol>
      </defs>
    </svg>

    <script type="module" src="src/boot.js"></script>
  </body>
</html>
