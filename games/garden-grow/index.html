<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Garden Grow · Mini Games</title>
    <meta name="description" content="Plant seeds, water them, and watch flowers bloom and butterflies arrive. A calm, bedtime-friendly garden for little ones and big kids." />
    <meta name="theme-color" content="#4d7a36" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- "Add to Home Screen" opens the game full screen, with no browser bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Garden Grow" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/build/three.module.js",
          "three/addons/": "../../vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-mode="little">
    <canvas id="scene" aria-label="Garden Grow: a sunny garden with soil ready for planting"></canvas>

    <div id="loader" role="progressbar" aria-label="Loading Garden Grow" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="loader-sprout" viewBox="0 0 96 96" aria-hidden="true">
        <ellipse cx="48" cy="88" rx="26" ry="3.5" fill="#5b4a2a" opacity="0.14" />
        <g class="sprout">
          <path class="stem" d="M48 66c0-9 .5-16-1-24" fill="none" stroke="#4f8a33" stroke-width="3" stroke-linecap="round" />
          <path class="leaf l" d="M47 44c-5-9-15-11-21-6 5 8 13 10 21 6z" fill="url(#g-leaf)" />
          <path class="leaf r" d="M47.4 41c3-10 13-13 20-8-4 8-12 11-20 8z" fill="url(#g-leaf)" />
        </g>
        <path d="M30 64h36l-4 24H34z" fill="url(#g-terracotta)" />
        <rect x="27" y="60" width="42" height="8" rx="2.5" fill="#d67c4e" />
        <rect x="27" y="60" width="42" height="2.4" rx="1.2" fill="#eaa079" />
        <ellipse cx="48" cy="61" rx="17" ry="2.2" fill="#5a3b24" />
      </svg>
      <p class="loader-title">Garden Grow</p>
      <div class="bar"><span id="loader-fill"></span></div>
      <p id="loader-text">Loading…</p>
    </div>

    <!-- start screen -->
    <section id="menu" hidden aria-labelledby="title">
      <a class="chip home-link" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" /></svg><span>Games</span>
      </a>
      <div class="menu-main">
        <h1 id="title" class="logo">
          <span class="w1">Garden</span>
          <span class="w2"><svg class="sprig" viewBox="0 0 64 40" aria-hidden="true"><use href="#i-sprig" /></svg>Grow</span>
        </h1>
        <button type="button" id="play" class="play" aria-label="Play">
          <svg class="petals" viewBox="0 0 120 120" aria-hidden="true"><use href="#i-petals" /></svg>
          <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.2v11.6l9.2-5.8z" /></svg></span>
        </button>
        <div class="modes" role="radiogroup" aria-label="Who is playing">
          <button type="button" class="mode" data-mode="little" role="radio" aria-checked="true">
            <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mode-little" /></svg><span>Little ones</span>
          </button>
          <button type="button" class="mode" data-mode="big" role="radio" aria-checked="false">
            <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mode-big" /></svg><span>Big kid</span>
          </button>
          <button type="button" class="mode" data-mode="bedtime" role="radio" aria-checked="false">
            <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mode-bedtime" /></svg><span>Bedtime garden</span>
          </button>
        </div>
      </div>
      <div class="pickers" data-where="menu"></div>
    </section>

    <!-- in-game HUD -->
    <header id="hud" hidden>
      <div class="hud-left">
        <button type="button" class="round" id="to-menu" aria-label="Back to the start screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.2 12 4.6l7.5 6.6" /><path d="M6.6 9.6v9.9h10.8V9.6" /><path d="M10.2 19.5v-4.6h3.6v4.6" /></svg>
        </button>
        <button type="button" class="round" id="settings-btn" aria-label="Change the garden, weather and time of day" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear" /></svg>
        </button>
        <button type="button" class="round mute" aria-pressed="false" aria-label="Sound off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2h3.6L12.4 5v14l-4.8-4.2H4z" class="fillc" /><path class="on" d="M15.8 8.8a4.6 4.6 0 0 1 0 6.4M18.4 6.3a8.2 8.2 0 0 1 0 11.4" /><path class="off" d="M16.2 9.5l5 5m0-5-5 5" /></svg>
        </button>
        <button type="button" class="round fs" aria-pressed="false" aria-label="Full screen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4.5 9.5v-5h5M14.5 4.5h5v5M19.5 14.5v5h-5M9.5 19.5h-5v-5" /><path class="exit" d="M9.5 4.5v5h-5M19.5 9.5h-5v-5M14.5 19.5v-5h5M4.5 14.5h5v5" /></svg>
        </button>
      </div>

      <!-- Big kid: what has been picked and harvested, and the visitors book -->
      <div class="hud-right">
        <div class="counts glass" role="group" aria-label="Your harvest">
          <span class="count" id="vase-box" title="Flowers in the vase"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-vase" /></svg><b id="vase-count">0</b><span class="sr">flowers in the vase</span></span>
          <span class="count" id="basket-box" title="Vegetables in the basket"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-basket" /></svg><b id="basket-count">0</b><span class="sr">vegetables in the basket</span></span>
        </div>
        <button type="button" class="round book-btn" id="book-btn" aria-label="Visitors book" aria-expanded="false" aria-controls="book">
          <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-book" /></svg><i class="dot" hidden></i>
        </button>
      </div>

      <!-- Big kid: tools and the seed packets -->
      <nav id="dock" aria-label="Garden tools" data-tool="seed">
        <div class="tools glass" role="radiogroup" aria-label="Tools">
          <button type="button" class="tool" data-tool="can" role="radio" aria-checked="false" aria-label="Watering can" title="Watering can"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-tool-can" /></svg></button>
          <button type="button" class="tool" data-tool="sun" role="radio" aria-checked="false" aria-label="Sun wand" title="Sun wand"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-tool-sun" /></svg></button>
          <button type="button" class="tool" data-tool="rain" role="radio" aria-checked="false" aria-label="Rain wand" title="Rain wand"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-tool-rain" /></svg></button>
          <button type="button" class="tool" data-tool="hand" role="radio" aria-checked="false" aria-label="Pick and harvest" title="Pick and harvest"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-tool-hand" /></svg></button>
          <button type="button" class="tool" data-tool="look" role="radio" aria-checked="false" aria-label="Look closer" title="Look closer"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-tool-look" /></svg></button>
        </div>
        <div class="tray glass">
          <div class="packets" id="packets" role="radiogroup" aria-label="Seed packets"></div>
        </div>
      </nav>
    </header>

    <div id="toast" aria-live="polite"></div>
    <div id="hint" aria-hidden="true">
      <svg class="trail" viewBox="0 0 160 60"><path d="M12 44C44 16 116 16 148 44" /></svg>
      <i class="ring"></i>
      <svg class="hand" viewBox="0 0 64 64"><use href="#i-hand" /></svg>
    </div>

    <button type="button" class="round fs menu-fs" aria-pressed="false" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4.5 9.5v-5h5M14.5 4.5h5v5M19.5 14.5v5h-5M9.5 19.5h-5v-5" /><path class="exit" d="M9.5 4.5v5h-5M19.5 9.5h-5v-5M14.5 19.5v-5h5M4.5 14.5h5v5" /></svg>
    </button>
    <button type="button" class="round mute menu-mute" aria-pressed="false" aria-label="Sound off" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.2h3.6L12.4 5v14l-4.8-4.2H4z" class="fillc" /><path class="on" d="M15.8 8.8a4.6 4.6 0 0 1 0 6.4M18.4 6.3a8.2 8.2 0 0 1 0 11.4" /><path class="off" d="M16.2 9.5l5 5m0-5-5 5" /></svg>
    </button>

    <!-- settings: the garden keeps growing behind it; tap outside to close -->
    <aside id="settings" class="overlay" hidden>
      <div class="sheet glass-strong" id="settings-sheet" role="dialog" aria-modal="false" aria-labelledby="settings-title" tabindex="-1">
        <h2 id="settings-title"><svg viewBox="0 0 64 40" aria-hidden="true"><use href="#i-sprig" /></svg>Your garden</h2>
        <div class="pickers" data-where="settings"></div>
        <button type="button" class="round close" id="settings-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
        </button>
      </div>
    </aside>

    <!-- Big kid: the visitors book -->
    <aside id="book" class="overlay" hidden>
      <div class="journal" id="book-journal" role="dialog" aria-modal="false" aria-labelledby="book-title" tabindex="-1">
        <div class="pages">
          <div class="page left">
            <header class="book-head">
              <h2 id="book-title">Visitors book</h2>
              <p id="book-found"></p>
            </header>
            <div class="book-groups" data-page="left"></div>
          </div>
          <div class="page right"><div class="book-groups" data-page="right"></div></div>
        </div>
        <i class="ribbon" aria-hidden="true"></i>
        <button type="button" class="round close" id="book-close" aria-label="Close the visitors book">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" /></svg>
        </button>
      </div>
    </aside>

    <noscript><p class="noscript">Garden Grow needs JavaScript to run.</p></noscript>
