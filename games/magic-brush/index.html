<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Magic Brush · Mini Games</title>
    <meta name="description" content="Paint a friend on a real canvas and watch it come alive: a baby dragon, a unicorn, a fox, an elephant, a whale, a butterfly and more leap out of the painting in your colours and play in a golden-hour garden. Little ones colour in an outline; big kids paint freely and the game guesses what it is." />
    <meta name="theme-color" content="#3b2a4a" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- "Add to Home Screen" opens the game full screen, with no browser bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magic Brush" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/build/three.module.js",
          "three/addons/": "../../vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-mode="little">
    <canvas id="scene" aria-label="Magic Brush: a canvas on an easel in a treehouse art studio"></canvas>

    <div id="loader" role="progressbar" aria-label="Loading Magic Brush" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="loader-logo" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-logo" /></svg>
      <p class="loader-title">Magic Brush</p>
      <div class="bar"><span id="loader-fill"></span></div>
      <p id="loader-text">Loading…</p>
    </div>

    <!-- start screen -->
    <section id="menu" hidden aria-labelledby="title">
      <a class="chip home-link" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span>Games</span>
      </a>
      <div class="menu-main">
        <h1 id="title" class="logo"><span class="sr">Magic Brush</span><span aria-hidden="true" class="logo-word"><span>M</span><span>a</span><span>g</span><span>i</span><span>c</span> <span>B</span><span>r</span><span>u</span><span>s</span><span>h</span></span></h1>
        <div class="menu-gap"></div>
        <div class="modes" role="radiogroup" aria-label="Who is painting">
          <button type="button" class="mode" data-mode="little" role="radio" aria-checked="true">
            <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-little" /></svg><span>Little ones</span>
          </button>
          <button type="button" class="mode" data-mode="big" role="radio" aria-checked="false">
            <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-big" /></svg><span>Big kid</span>
          </button>
        </div>
        <button type="button" id="start" class="go start" aria-label="Start painting">
          <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-play" /></svg>
        </button>
      </div>
    </section>
    <div class="corner menu-corner" hidden>
      <button type="button" class="round shelf-btn" aria-label="Your friends"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-palette" /></svg></button>
      <button type="button" class="round fs" aria-pressed="false" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
      </button>
      <button type="button" class="round mute" aria-pressed="false" aria-label="Sound off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
      </button>
    </div>

    <!-- painting -->
    <div id="hud" hidden>
      <div class="corner top-left">
        <button type="button" class="round to-menu" aria-label="Back to the start screen"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home" /></svg></button>
        <button type="button" class="round" id="pick-btn" aria-label="Pick a friend to paint"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star" /></svg></button>
        <button type="button" class="round big-only" id="new-btn" aria-label="A fresh canvas"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-new" /></svg></button>
        <button type="button" class="round big-only" id="keep-btn" aria-label="Keep this painting"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-keep" /></svg></button>
      </div>
      <div class="corner top-right">
        <button type="button" class="round" id="world-btn" aria-label="Go and play with your friends"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-garden" /></svg></button>
        <button type="button" class="round shelf-btn" aria-label="Your friends"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-palette" /></svg></button>
        <button type="button" class="round fs" aria-pressed="false" aria-label="Full screen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
        </button>
        <button type="button" class="round mute" aria-pressed="false" aria-label="Sound off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
        </button>
      </div>
      <div id="toolbar" role="toolbar" aria-label="Paints and brushes">
        <button type="button" class="tool undo" id="undo-btn" aria-label="Undo"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-undo" /></svg></button>
        <div class="paints" role="radiogroup" aria-label="Colours"></div>
        <div class="kinds" role="radiogroup" aria-label="Brushes">
          <button type="button" class="tool kind" data-kind="glitter" role="radio" aria-checked="false" aria-label="Glitter brush"><svg viewBox="0 0 40 64" aria-hidden="true"><use href="#i-glitter" /></svg></button>
          <button type="button" class="tool kind" data-kind="water" role="radio" aria-checked="false" aria-label="Watercolour brush"><svg viewBox="0 0 40 64" aria-hidden="true"><use href="#i-water" /></svg></button>
          <button type="button" class="tool kind" data-kind="sponge" role="radio" aria-checked="false" aria-label="Sponge"><svg viewBox="0 0 40 64" aria-hidden="true"><use href="#i-sponge" /></svg></button>
        </div>
        <div class="sizes big-only" role="radiogroup" aria-label="Brush size">
          <button type="button" class="size" data-size="small" role="radio" aria-checked="false" aria-label="Thin brush"><span style="--d: 8px"></span></button>
          <button type="button" class="size" data-size="medium" role="radio" aria-checked="true" aria-label="Medium brush"><span style="--d: 14px"></span></button>
          <button type="button" class="size" data-size="large" role="radio" aria-checked="false" aria-label="Fat brush"><span style="--d: 22px"></span></button>
        </div>
        <button type="button" class="go" id="go-btn" aria-label="Make it come alive"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-play" /></svg></button>
      </div>
    </div>

    <!-- playing with friends in the garden -->
    <div id="play-hud" hidden>
      <div class="corner top-left">
        <button type="button" class="round to-menu" aria-label="Back to the start screen"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home" /></svg></button>
      </div>
      <div class="corner top-right">
        <button type="button" class="round shelf-btn" aria-label="Your friends"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-palette" /></svg></button>
        <button type="button" class="round fs" aria-pressed="false" aria-label="Full screen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
        </button>
        <button type="button" class="round mute" aria-pressed="false" aria-label="Sound off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
        </button>
      </div>
      <button type="button" class="paint-new" id="paint-btn" aria-label="Paint a new friend"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-easel" /></svg></button>
    </div>

    <!-- pick a friend to paint -->
    <div id="picker" class="overlay" hidden role="dialog" aria-label="Pick a friend to paint">
      <div class="sheet">
        <div class="pick-grid" role="list"></div>
        <button type="button" class="round close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button>
      </div>
    </div>

    <!-- big kids: what did you paint? -->
    <div id="guess" class="overlay" hidden role="dialog" aria-label="What did you paint?">
      <div class="sheet guess-sheet">
        <div class="guess-think" aria-hidden="true"><svg viewBox="0 0 48 48"><use href="#i-think" /></svg></div>
        <div class="guess-cards" role="list"></div>
        <button type="button" class="chip guess-more"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-more" /></svg><span>Something else</span></button>
        <button type="button" class="round close" aria-label="Back to painting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button>
      </div>
    </div>

    <!-- the friends shelf -->
    <div id="shelf" class="overlay" hidden role="dialog" aria-label="Your friends">
      <div class="palette-board">
        <div class="shelf-grid" role="list"></div>
        <p class="shelf-empty" hidden>Paint a friend and it will wait for you here.</p>
        <div class="shelf-paintings" role="list" aria-label="Kept paintings"></div>
        <button type="button" class="round close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg></button>
      </div>
    </div>

    <div id="callout" aria-live="polite"></div>

    <noscript><p class="noscript">Magic Brush needs JavaScript to run.</p></noscript>

    <!-- icons -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b27a" /><stop offset="1" stop-color="#a86c3c" /></linearGradient>
        <linearGradient id="g-ferrule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa0a8" /><stop offset="0.45" stop-color="#f4f6f8" /><stop offset="1" stop-color="#8a9098" /></linearGradient>
        <linearGradient id="g-go" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ee07a" /><stop offset="1" stop-color="#23a043" /></linearGradient>
        <linearGradient id="g-rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b6b" /><stop offset="0.25" stop-color="#ffc93c" /><stop offset="0.5" stop-color="#6ed36e" /><stop offset="0.75" stop-color="#4fa8ff" /><stop offset="1" stop-color="#b16cff" /></linearGradient>
        <radialGradient id="g-sponge" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#ffe27a" /><stop offset="1" stop-color="#eab126" /></radialGradient>
        <!-- a paint brush with a colour tip: the tip takes currentColor -->
        <symbol id="i-brush" viewBox="0 0 40 64"><path d="M20 3c5.5 5 8 11 8 17 0 3-1.2 5-2.2 6H14.2C13.2 25 12 23 12 20c0-6 2.5-12 8-17z" fill="currentColor" stroke="rgba(0,0,0,0.25)" stroke-width="1" /><path d="M16 9c-1.5 3-2 6-2 9" stroke="rgba(255,255,255,0.55)" stroke-width="2" fill="none" stroke-linecap="round" /><rect x="13.5" y="26" width="13" height="9" rx="1.5" fill="url(#g-ferrule)" /><path d="M14.5 35h11l-1.6 25a3.4 3.4 0 0 1-6.8 0z" fill="var(--handle, #c0392b)" /><path d="M17.4 37l.8 20" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linecap="round" /></symbol>
        <symbol id="i-glitter" viewBox="0 0 40 64"><use href="#i-brush" style="--handle: #8e44d0" color="#d7b4ff" /><g fill="#fff"><path d="M8 8l1.2 3 3 1.2-3 1.2L8 16.4l-1.2-3-3-1.2 3-1.2z" /><path d="M31 4l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9z" /><path d="M33 17l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z" /><circle cx="18" cy="12" r="1.2" /><circle cx="23" cy="18" r="1" /><circle cx="20" cy="22" r="0.9" /></g></symbol>
        <symbol id="i-water" viewBox="0 0 40 64"><use href="#i-brush" style="--handle: #2f6fb8" color="#7cc4ff" /><path d="M33 6c2.6 3.4 3.8 5.6 3.8 7.4a3.8 3.8 0 0 1-7.6 0c0-1.8 1.2-4 3.8-7.4z" fill="#8fd0ff" stroke="#3a8ad0" stroke-width="1" /></symbol>
        <symbol id="i-sponge" viewBox="0 0 40 64"><rect x="5" y="18" width="30" height="24" rx="8" fill="url(#g-sponge)" stroke="#c98f16" stroke-width="1.2" /><g fill="#d9990f" opacity="0.7"><circle cx="12" cy="25" r="2.2" /><circle cx="21" cy="23" r="1.6" /><circle cx="28" cy="27" r="2.4" /><circle cx="15" cy="33" r="1.8" /><circle cx="24" cy="35" r="2" /><circle cx="30" cy="36" r="1.2" /><circle cx="9" cy="37" r="1.3" /></g></symbol>
        <symbol id="i-undo" viewBox="0 0 48 48"><path d="M16 14 7 22l9 8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M8 22h19a11 11 0 0 1 0 22h-6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" /></symbol>
        <symbol id="i-play" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="url(#g-go)" /><path d="M19 14.5v19l15.5-9.5z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round" /><path d="M9 18a16 16 0 0 1 12-10" stroke="rgba(255,255,255,0.45)" stroke-width="3" fill="none" stroke-linecap="round" /></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20h-5.5v-5h-5v5H4z" fill="currentColor" /></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="#ffd04a" stroke="#d99a12" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="2 1.6" /></symbol>
        <symbol id="i-new" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="#fffdf6" stroke="currentColor" stroke-width="1.8" /><path d="M12 8v8M8 12h8" stroke="#2ea44f" stroke-width="2.2" stroke-linecap="round" /></symbol>
        <symbol id="i-keep" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="15" rx="1.5" fill="#f0d9b5" stroke="#9a6a3a" stroke-width="1.8" /><rect x="6" y="7" width="12" height="9" fill="#fffdf6" /><path d="M12 15.2l-2.7-2.5a1.6 1.6 0 0 1 2.3-2.2l.4.4.4-.4a1.6 1.6 0 0 1 2.3 2.2z" fill="#f06a8c" /></symbol>
        <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3c5 0 9 3.4 9 7.6 0 2.8-2.1 4-4.2 4H15a1.8 1.8 0 0 0-1.3 3.1c.8.8.3 2.3-1.1 2.3C7.3 20 3 16.4 3 11.5 3 6.8 7 3 12 3z" fill="#e7b77a" stroke="#9a6a3a" stroke-width="1.4" /><circle cx="7.8" cy="10.8" r="1.6" fill="#e53935" /><circle cx="10.4" cy="7.2" r="1.6" fill="#fdd835" /><circle cx="14.6" cy="7" r="1.6" fill="#43b649" /><circle cx="17.4" cy="10.4" r="1.6" fill="#1e88e5" /></symbol>
        <symbol id="i-garden" viewBox="0 0 24 24"><circle cx="17" cy="6" r="3" fill="#ffc93c" /><path d="M2 20c2-4 5-6 10-6s8 2 10 6z" fill="#6cc04a" /><path d="M7 15V9" stroke="#3f7a2a" stroke-width="1.6" /><circle cx="7" cy="8" r="2.4" fill="#f06ab0" /><circle cx="7" cy="8" r="0.9" fill="#ffe27a" /></symbol>
        <symbol id="i-easel" viewBox="0 0 64 64"><path d="M14 60 26 8M50 60 38 8M32 6v50" stroke="url(#g-wood)" stroke-width="4.5" stroke-linecap="round" /><rect x="12" y="12" width="40" height="30" rx="2" fill="#fffdf6" stroke="#c9a57a" stroke-width="2" /><path d="M18 34c4-9 9-13 14-9s8 1 12-5" stroke="url(#g-rainbow)" stroke-width="5" fill="none" stroke-linecap="round" /><rect x="10" y="41" width="44" height="5" rx="2" fill="url(#g-wood)" /><g transform="translate(40 28) rotate(35)"><rect x="-2.5" y="-4" width="5" height="22" rx="2" fill="#c0392b" /><rect x="-3" y="-9" width="6" height="6" fill="url(#g-ferrule)" /><path d="M-3-9c0-5 1.5-8 3-10 1.5 2 3 5 3 10z" fill="#8e44d0" /></g></symbol>
        <symbol id="i-little" viewBox="0 0 48 48"><circle cx="24" cy="26" r="14" fill="#ffd9a8" /><circle cx="19" cy="24" r="2" fill="#4a3426" /><circle cx="29" cy="24" r="2" fill="#4a3426" /><path d="M19 31c3 2.5 7 2.5 10 0" stroke="#c0604a" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M13 20c1-8 8-12 14-10 3-2 7-1 8 2" stroke="#8a5a36" stroke-width="3" fill="none" stroke-linecap="round" /><circle cx="15" cy="29" r="2.2" fill="#f4a3a3" opacity="0.7" /><circle cx="33" cy="29" r="2.2" fill="#f4a3a3" opacity="0.7" /></symbol>
        <symbol id="i-big" viewBox="0 0 48 48"><circle cx="22" cy="23" r="12" fill="#f5c79a" /><circle cx="18" cy="22" r="1.8" fill="#4a3426" /><circle cx="26" cy="22" r="1.8" fill="#4a3426" /><path d="M18 28c2.5 2 5.5 2 8 0" stroke="#c0604a" stroke-width="2" fill="none" stroke-linecap="round" /><path d="M10 20c0-9 8-13 15-11 5 1 8 5 8 10-4-3-9-3-12-6-3 4-7 5-11 7z" fill="#5a3a22" /><g transform="translate(36 30) rotate(30)"><rect x="-2" y="0" width="4" height="16" rx="1.6" fill="#2f6fb8" /><rect x="-2.4" y="-4" width="4.8" height="4.5" fill="url(#g-ferrule)" /><path d="M-2.4-4c0-4 1.2-6 2.4-8 1.2 2 2.4 4 2.4 8z" fill="#e53935" /></g></symbol>
        <symbol id="i-think" viewBox="0 0 48 48"><circle cx="24" cy="22" r="14" fill="#fffdf6" stroke="#c9a57a" stroke-width="2" /><circle cx="12" cy="40" r="3" fill="#fffdf6" stroke="#c9a57a" stroke-width="1.6" /><circle cx="7" cy="45" r="1.8" fill="#fffdf6" stroke="#c9a57a" stroke-width="1.4" /><path d="M19 18a5 5 0 1 1 7 4.6c-1.4.7-2 1.6-2 3v1" stroke="#8e44d0" stroke-width="3" fill="none" stroke-linecap="round" /><circle cx="24" cy="31" r="1.8" fill="#8e44d0" /></symbol>
        <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2" fill="currentColor" /><circle cx="12" cy="12" r="2" fill="currentColor" /><circle cx="18" cy="12" r="2" fill="currentColor" /></symbol>
        <symbol id="i-logo" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#3b2a4a" /><path d="M16 44c6-14 14-20 22-16s12 2 14-6" stroke="url(#g-rainbow)" stroke-width="7" fill="none" stroke-linecap="round" /><g transform="translate(40 30) rotate(35)"><rect x="-3" y="2" width="6" height="22" rx="2.4" fill="#c0392b" /><rect x="-3.6" y="-4" width="7.2" height="6.5" fill="url(#g-ferrule)" /><path d="M-3.6-4c0-6 1.8-9 3.6-12 1.8 3 3.6 6 3.6 12z" fill="#ffd04a" /></g><g fill="#fff"><path d="M14 16l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" /><circle cx="50" cy="14" r="1.6" /><circle cx="22" cy="10" r="1.2" /></g></symbol>
      </defs>
    </svg>

    <script type="module" src="src/boot.js"></script>
  </body>
</html>
