<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Block Tower · Mini Games</title>
    <meta name="description" content="Stack photoreal wooden toy blocks as high as you dare, then knock the tower down with a flick, a rolling ball, a wind-up car or a wrecking ball. No losing, ever. For little ones and big kids." />
    <meta name="theme-color" content="#e9c592" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- "Add to Home Screen" opens the game full screen, with no browser bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Block Tower" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/build/three.module.js",
          "three/addons/": "../../vendor/three/examples/jsm/",
          "@dimforge/rapier3d-compat": "../../vendor/rapier/rapier.mjs"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-mode="little" data-room="playroom">
    <canvas id="scene" aria-label="Block Tower: wooden toy blocks on the floor of a sunny room"></canvas>

    <div id="loader" role="progressbar" aria-label="Loading Block Tower" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="loader-tower" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-tower" /></svg>
      <p class="loader-title">Block Tower</p>
      <div class="bar"><span id="loader-fill"></span></div>
      <p id="loader-text">Loading…</p>
    </div>

    <!-- start screen -->
    <section id="menu" hidden aria-labelledby="title">
      <a class="chip home-link" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span>Games</span>
      </a>
      <div class="menu-main">
        <h1 id="title" class="logo">
          <span class="sr">Block Tower</span>
          <span class="row r1" aria-hidden="true"><i>B</i><i>L</i><i>O</i><i>C</i><i>K</i></span>
          <span class="row r2" aria-hidden="true"><i>T</i><i>O</i><i>W</i><i>E</i><i>R</i></span>
        </h1>
        <button type="button" id="play" class="play" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5v13l10.5-6.5z" /></svg>
        </button>
        <div class="modes" role="radiogroup" aria-label="Who is playing">
          <button type="button" class="mode" data-mode="little" role="radio" aria-checked="true"><span>Little ones</span></button>
          <button type="button" class="mode" data-mode="big" role="radio" aria-checked="false"><span>Big kid</span></button>
        </div>
        <p class="menu-best" id="menu-best" hidden title="Tallest tower">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-trophy" /></svg><span>Tallest tower</span><b><i id="menu-best-cm">0</i> cm</b>
        </p>
      </div>
      <div class="pickers" data-where="menu"></div>
    </section>
    <button type="button" class="round fs menu-fs" aria-pressed="false" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
    </button>
    <button type="button" class="round mute menu-mute" aria-pressed="false" aria-label="Sound off" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
    </button>

    <!-- in-game HUD -->
    <div id="hud" hidden>
      <div class="hud-buttons">
        <button type="button" class="round" id="to-menu" aria-label="Back to the start screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20h-5.5v-5h-5v5H4z" class="fillc" /></svg>
        </button>
        <button type="button" class="round" id="settings-btn" aria-label="Change blocks, room and toys" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear" /></svg>
        </button>
        <button type="button" class="round mute" aria-pressed="false" aria-label="Sound off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
        </button>
        <button type="button" class="round fs" aria-pressed="false" aria-label="Full screen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
        </button>
      </div>

      <!-- Big kid: height, best and the wobble meter -->
      <div class="stats big-only" id="stats">
        <p class="height" title="Tower height">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-ruler" /></svg><b id="height">0</b><small>cm</small>
        </p>
        <p class="best" id="best-box" hidden title="Tallest tower">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-trophy" /></svg><span>Best</span><b id="best">0</b><small>cm</small>
        </p>
        <div class="wobble" id="wobble" data-level="calm" role="meter" aria-label="Wobble" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Steady">
          <svg viewBox="0 0 64 40" aria-hidden="true">
            <path d="M8 34A24 24 0 0 1 25.4 10.9" class="arc calm" />
            <path d="M28.5 10.2A24 24 0 0 1 45.1 13.9" class="arc warn" />
            <path d="M48 16.1A24 24 0 0 1 56 34" class="arc high" />
            <g id="wobble-needle" class="needle"><path d="M32 34V14.5" /><circle cx="32" cy="34" r="4.2" /></g>
          </svg>
          <small>Wobble</small>
        </div>
      </div>

      <!-- Little ones: one big knock-down button -->
      <button type="button" id="knock" class="little-only" aria-label="Knock the tower down">
        <svg viewBox="0 0 64 64" class="tool-icon" aria-hidden="true"><use href="#i-tool-flick" /></svg>
      </button>

      <!-- Big kid: challenges, block tray, turn and Crash! -->
      <div class="dock big-only" id="dock">
        <div class="chal-wrap">
          <button type="button" id="turn" class="turn" hidden aria-label="Turn the block">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-turn" /></svg>
          </button>
          <button type="button" id="challenge-btn" aria-haspopup="true" aria-expanded="false" aria-controls="challenges" aria-label="Challenges: free build">
            <svg viewBox="0 0 40 40" class="ring" aria-hidden="true"><circle cx="20" cy="20" r="18" class="track" /><circle id="challenge-ring" cx="20" cy="20" r="18" class="fill" pathLength="100" /></svg>
            <i id="challenge-pic" class="pic"></i>
            <span id="challenge-name" class="badge">Free build</span>
          </button>
          <div id="challenges" class="popover" hidden role="dialog" aria-label="Challenges">
            <p class="pop-title">Challenges</p>
            <div id="challenge-grid" class="chal-grid" role="radiogroup" aria-label="Challenges"></div>
          </div>
        </div>
        <nav id="tray" aria-label="Blocks to build with"></nav>
        <button type="button" id="finish" aria-label="Crash! Knock the tower down">
          <svg viewBox="0 0 64 64" class="tool-icon" aria-hidden="true"><use href="#i-tool-flick" /></svg>
          <span>Crash!</span>
        </button>
      </div>

    </div>

    <div id="callout" aria-live="polite"></div>
    <div id="points" aria-hidden="true"></div>

    <!-- settings overlay: the game keeps playing behind it -->
    <aside id="settings" hidden aria-label="Change blocks, room and toys">
      <div class="pickers" data-where="settings"></div>
      <button type="button" class="round close" id="settings-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </aside>

    <noscript><p class="noscript">Block Tower needs JavaScript to run.</p></noscript>

        <linearGradient id="g-patio-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f4" /><stop offset="1" stop-color="#d6f0ff" /></linearGradient>
        <linearGradient id="g-bed-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f5aa0" /><stop offset="1" stop-color="#7b77b8" /></linearGradient>
        <radialGradient id="g-lamp-glow"><stop offset="0" stop-color="#ffe3a0" stop-opacity="0.95" /><stop offset="0.5" stop-color="#ffc870" stop-opacity="0.4" /><stop offset="1" stop-color="#ffc870" stop-opacity="0" /></radialGradient>
        <radialGradient id="g-ball-shade" cx="0.38" cy="0.32" r="0.75"><stop offset="0.45" stop-color="#5a1a0e" stop-opacity="0" /><stop offset="1" stop-color="#5a1a0e" stop-opacity="0.38" /></radialGradient>

        <clipPath id="c-room"><rect width="64" height="64" rx="12" /></clipPath>
        <clipPath id="c-ball"><circle cx="37" cy="32" r="20" /></clipPath>
