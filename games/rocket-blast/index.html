<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Rocket Blast · Mini Games</title>
    <meta name="description" content="Fly a happy toy rocket and blast googly-eyed toy blocks into showers of stars and sweets. No losing, ever. For little ones and big kids." />
    <meta name="theme-color" content="#1d63d8" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <!-- "Add to Home Screen" opens the game full screen, with no browser bars -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rocket Blast" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three/build/three.module.js",
          "three/addons/": "../../vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body data-state="loading" data-mode="little">
    <canvas id="scene" aria-label="Rocket Blast: a toy rocket blasting toy blocks in the sky"></canvas>

    <div id="loader" role="progressbar" aria-label="Loading Rocket Blast" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="loader-rocket" viewBox="0 0 64 96" aria-hidden="true"><use href="#i-rocket" /></svg>
      <div class="bar"><span id="loader-fill"></span></div>
      <p id="loader-text">Loading…</p>
    </div>

    <!-- start screen -->
    <section id="menu" hidden aria-labelledby="title">
      <a class="chip home-link" href="../../index.html" aria-label="Back to all games">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span>Games</span>
      </a>
      <div class="menu-main">
        <h1 id="title" class="logo"><span class="gtext w1" data-text="Rocket">Rocket</span><span class="gtext w2" data-text="Blast">Blast</span></h1>
        <button type="button" id="play" class="play" aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
        </button>
        <div class="modes" role="radiogroup" aria-label="Game mode">
          <button type="button" class="mode" data-mode="little" role="radio" aria-checked="true">
            <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mode-little" /></svg><span>Little Pilot</span>
          </button>
          <button type="button" class="mode" data-mode="big" role="radio" aria-checked="false">
            <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mode-big" /></svg><span>Big Kid</span>
          </button>
          <button type="button" class="mode" data-mode="free" role="radio" aria-checked="false">
            <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mode-free" /></svg><span>Free Blast</span>
          </button>
        </div>
        <p class="bests" aria-live="polite">
          <span class="best" data-best="little" title="Most stars in one flight"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star" /></svg><b>0</b></span>
          <span class="best" data-best="big" title="Best Big Kid score"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-trophy" /></svg><b>0</b></span>
        </p>
      </div>
      <div class="pickers" data-where="menu"></div>
    </section>

    <!-- in-game HUD -->
    <header id="hud" hidden>
      <div class="hud-left">
        <button type="button" class="round" id="to-menu" aria-label="Back to the start screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5V20h-5.5v-5h-5v5H4z" class="fillc" /></svg>
        </button>
        <button type="button" class="round" id="settings-btn" aria-label="Change rocket, world and toys" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear" /></svg>
        </button>
        <button type="button" class="round mute" aria-pressed="false" aria-label="Sound off">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
        </button>
        <button type="button" class="round fs" aria-pressed="false" aria-label="Full screen" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
        </button>
      </div>
      <div class="hud-right">
        <div class="score" id="score-box" aria-live="polite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star" /></svg><b id="score">0</b>
        </div>
        <div class="wave" id="wave-box" hidden><small>Wave</small><b id="wave">1</b></div>
        <div class="combo" id="combo" hidden aria-hidden="true">
          <b id="combo-mult">×1</b>
          <span class="combo-count"><i id="combo-count">0</i></span>
          <span class="meter"><i id="combo-bar"></i></span>
        </div>
      </div>
      <div class="boss-bar" id="boss-bar" hidden aria-hidden="true"><i id="boss-fill"></i></div>
    </header>

    <button type="button" id="fire" hidden aria-label="Fire!"><span>FIRE!</span></button>
    <div id="callout" aria-live="polite"></div>
    <div id="flyers" aria-hidden="true"></div>
    <div id="hint" aria-hidden="true"><svg viewBox="0 0 64 64"><use href="#i-hand" /></svg></div>
    <button type="button" class="round fs menu-fs" aria-pressed="false" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9.5V4h5.5M14.5 4H20v5.5M20 14.5V20h-5.5M9.5 20H4v-5.5" /><path class="exit" d="M9.5 4v5.5H4M20 9.5h-5.5V4M14.5 20v-5.5H20M4 14.5h5.5V20" /></svg>
    </button>
    <button type="button" class="round mute menu-mute" aria-pressed="false" aria-label="Sound off" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" class="fillc" /><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="off" d="M17 9l5 6m0-6-5 6" /></svg>
    </button>

    <!-- settings overlay: the game keeps playing behind it -->
    <aside id="settings" hidden aria-label="Change rocket, world and toys">
      <div class="pickers" data-where="settings"></div>
      <button type="button" class="round close" id="settings-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </aside>

    <noscript><p class="noscript">Rocket Blast needs JavaScript to run.</p></noscript>
